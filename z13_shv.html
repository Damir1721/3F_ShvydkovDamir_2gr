<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 13 - Shvydkov</title>
    <script type="text/javascript">
        function okno_zamknij() {
            window.close();
        }
    </script>
</head>
<body>

    <div style="color:blue; font-size:40px;">
        <script language="JavaScript">
            var m_shv = prompt("Podaj liczbę m=", "");
            var m = parseFloat(m_shv);

            var m1 = m + 1;
            var m2 = m * (m + 1);

            document.write("1/" + m + " = 1/" + m1 + " + 1/" + m2 + "<br>");
        </script>
    </div>

    <br><br>
    <input type="button" value="zamknij okno" onclick="okno_zamknij()" />

</body>
</html>
