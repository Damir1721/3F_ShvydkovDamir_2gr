<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 8 - Shvydkov</title>
    <script type="text/javascript">
        function show_confirm() {
            var r = confirm("Naciśnij klawisz");
            if (r == true) {
                document.write("Nacisnąłeś OK!");
            } else {
                document.write("Nacisnąłeś Cancel!");
            }
        }

        function okno_zamknij_shvydkov() {
            window.close();
        }
    </script>
</head>
<body style="font-family: Arial, sans-serif; margin: 20px;">

    <h2>Zadanie 8 - Confirm Box</h2>

    <p><b>Teoria:</b></p>
    <p><b>Zastosowanie:</b> Jest używany, jeśli chcemy zapytać użytkownika o weryfikację lub akceptację jakichś danych. Użytkownik musi nacisnąć „OK” w celu akceptacji bądź „Cancel” w celu odrzucenia. Jeżeli zostanie wybrane „OK”, metoda zwraca <i>true</i>, w przeciwnym wypadku <i>false</i>.</p>

    <br><br>

    <input type="button" onclick="show_confirm()" value="Pokaż confirm box" />

    <br><br><br>

    <input type="button" value="zamknij okno" onclick="okno_zamknij_shvydkov()" />

</body>
</html>
