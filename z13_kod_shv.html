<div style="color:blue; font-size:40px;">
<script language="JavaScript">
    // Damir Shvydkov 3F
    // Zadanie 13 - Ułamek egipski

    var m_shv = prompt("Podaj liczbę m=", "");
    var m = parseFloat(m_shv);

    var m1 = m + 1;
    var m2 = m * (m + 1);

    document.write("1/" + m + " = 1/" + m1 + " + 1/" + m2 + "<br>");

    function okno_zamknij() {
        window.close();
    }
</script>
</div>

<input type="button" value="zamknij okno" onclick="okno_zamknij()" />
