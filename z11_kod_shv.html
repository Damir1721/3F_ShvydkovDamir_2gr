<script language="JavaScript">
    // Damir Shvydkov 3F
    // Zadanie 11

    var D1_shv = prompt("Podaj pierwszy dzień stycznia (D1)=", "");
    var D2_shv = prompt("Podaj drugi dzień stycznia (D2)=", "");
    var sekund;
    var a = parseFloat(D1_shv);
    var b = parseFloat(D2_shv);

    sekund = (a - b) * 24 * 60 * 60;
    document.write("Ilość sekund między dniami " + a + " i " + b + " = " + sekund + " sekund<br>");

    function okno_zamknij_shvydkov() {
        window.close();
    }
</script>
</div>

<input type="button" value="zamknij okno" onclick="okno_zamknij_shvydkov()" />
