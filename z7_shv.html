    <script type="text/javascript">
        function show_alert() {

        }

        function okno_zamknij_shvydkov() {
            window.close();
        }
    </script>
</head>
<body style="font-family: Arial, sans-serif; margin: 20px;">

    <p><b>Teoria:</b></p>

    <br><br>

    <input type="button" onclick="show_alert()" value="Pokaż Alert Box" />

    <br><br><br>

    <input type="button" value="zamknij okno" onclick="okno_zamknij_shvydkov()" />
