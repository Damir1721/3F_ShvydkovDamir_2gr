<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 12 - Shvydkov</title>
    <script type="text/javascript">
        function okno_zamknij() {
            window.close();
        }
    </script>
</head>
<body>

    <div style="color:green; font-size:45px;">
        <script language="JavaScript">
            var D1_shv = prompt("Podaj pierwszy dzień stycznia (D1)=", "");
            var G1_shv = prompt("Podaj godzinę pierwszego dnia (G1)=", "");
            var D2_shv = prompt("Podaj drugi dzień stycznia (D2)=", "");
            var G2_shv = prompt("Podaj godzinę drugiego dnia (G2)=", "");

            var d1 = parseFloat(D1_shv);
            var g1 = parseFloat(G1_shv);
            var d2 = parseFloat(D2_shv);
            var g2 = parseFloat(G2_shv);

            var ilosc_godzin = (d1 - d2) * 24 + (g1 - g2);
            var ilosc_sekund = ilosc_godzin * 3600;

            document.write("Ilość sekund między dniem " + d1 + " (godz. " + g1 + ") a dniem " + d2 + " (godz. " + g2 + ") = " + ilosc_sekund + " sekund<br>");
        </script>
    </div>

    <br><br>
    <input type="button" value="zamknij okno" onclick="okno_zamknij()" />

</body>
</html>
