<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 20 - Shvydkov</title>
    <script type="text/javascript">
        function AB_shv() {
            var xa_shv = parseFloat(document.getElementById('xa').value);
            var ya_shv = parseFloat(document.getElementById('ya').value);
            var xb_shv = parseFloat(document.getElementById('xb').value);
            var yb_shv = parseFloat(document.getElementById('yb').value);

            var ab = Math.sqrt(Math.pow(xa_shv - xb_shv, 2) + Math.pow(ya_shv - yb_shv, 2));
            document.getElementById("wynik_ab").innerHTML = "Długość boku AB = " + ab.toFixed(2);
        }

        function BC_shv() {
            var xb_shv = parseFloat(document.getElementById('xb').value);
            var yb_shv = parseFloat(document.getElementById('yb').value);
            var xc_shv = parseFloat(document.getElementById('xc').value);
            var yc_shv = parseFloat(document.getElementById('yc').value);

            var bc = Math.sqrt(Math.pow(xb_shv - xc_shv, 2) + Math.pow(yb_shv - yc_shv, 2));
            document.getElementById("wynik_bc").innerHTML = "Długość boku BC = " + bc.toFixed(2);
        }

        function AC_shv() {
            var xa_shv = parseFloat(document.getElementById('xa').value);
            var ya_shv = parseFloat(document.getElementById('ya').value);
            var xc_shv = parseFloat(document.getElementById('xc').value);
            var yc_shv = parseFloat(document.getElementById('yc').value);

            var ac = Math.sqrt(Math.pow(xa_shv - xc_shv, 2) + Math.pow(ya_shv - yc_shv, 2));
            document.getElementById("wynik_ac").innerHTML = "Długość boku AC = " + ac.toFixed(2);
        }

        function oblicz_wszystko_shv() {
            AB_shv();
            BC_shv();
            AC_shv();
        }

        function okno_zamknij() {
            window.close();
        }
    </script>
</head>
<body>

    <h2>Obliczanie długości boków trójkąta ABC</h2>

    Punkt A: 
    x<sub>A</sub> = <input type="text" id="xa" size="5" value="0"> 
    y<sub>A</sub> = <input type="text" id="ya" size="5" value="0"><br><br>

    Punkt B: 
    x<sub>B</sub> = <input type="text" id="xb" size="5" value="3"> 
    y<sub>B</sub> = <input type="text" id="yb" size="5" value="0"><br><br>

    Punkt C: 
    x<sub>C</sub> = <input type="text" id="xc" size="5" value="0"> 
    y<sub>C</sub> = <input type="text" id="yc" size="5" value="4"><br><br>

    <input type="button" value="Oblicz AB" onclick="AB_shv()">
    <input type="button" value="Oblicz BC" onclick="BC_shv()">
    <input type="button" value="Oblicz AC" onclick="AC_shv()">
    <input type="button" value="Oblicz wszystkie boki" onclick="oblicz_wszystko_shv()"><br><br>

    <div style="color:navy; font-size:30px;" id="wynik_ab"></div>
    <div style="color:navy; font-size:30px;" id="wynik_bc"></div>
    <div style="color:navy; font-size:30px;" id="wynik_ac"></div>

    <br><br>
    <input type="button" value="zamknij okno" onclick="okno_zamknij()" />

</body>
</html>
