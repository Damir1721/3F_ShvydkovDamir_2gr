<div style="color:green; font-size:40px;">
<script language="JavaScript">
    // Damir Shvydkov 3F
    // Zadanie 15 - Rozkład ułamka egipskiego na dwa takie same ułamki

    var m_shv = prompt("Podaj liczbę m=", "");
    var m = parseFloat(m_shv);

    var m1 = 2 * m;

    document.write("1/" + m + " = 1/" + m1 + " + 1/" + m1 + "<br>");

    function okno_zamknij() {
        window.close();
    }
</script>
</div>

<input type="button" value="zamknij okno" onclick="okno_zamknij()" />
